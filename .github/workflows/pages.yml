name: Test and deploy CPI to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js for tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run regression tests
        run: npm test
      - name: Stage static site
        run: |
          mkdir -p public/src
          cp index.html styles.css public/
          cp src/*.js public/src/
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
